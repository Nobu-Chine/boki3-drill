<body>
<div class="wrap">

  <h1>簿記三級 仕訳ドリル</h1>
  <div class="subtitle">分野別・5問チャレンジ</div>

  <!-- ============ ホーム画面 ============ -->
  <div id="home-screen">
    <div id="weak-banner" class="weak-banner hidden">
      <div class="label">苦手分野</div>
      <div class="cat-name" id="weak-cat-name">-</div>
      <button id="weak-start-btn">この分野に挑戦する</button>
    </div>
    <div id="cat-list"></div>
    <a href="#" class="back-link" id="reset-link">成績をリセットする</a>
  </div>

  <!-- ============ 出題画面 ============ -->
  <div id="quiz-screen" class="hidden">
    <div class="top-bar">
      <span id="quiz-cat-name">-</span>
      <span>第 <b id="q-num">1</b> / <span id="q-total">5</span> 問</span>
    </div>

    <div class="nav-bar">
      <button id="prev-nav-btn" class="nav-btn">← 前の問題</button>
      <button id="next-nav-btn" class="nav-btn">次の問題 →</button>
    </div>

    <div id="question-box" class="box">
      <span class="tag" id="cat-tag">-</span>
      <div class="qtext" id="question-text">-</div>

      <label>借方</label>
      <select id="debit-select"></select>

      <label>貸方</label>
      <select id="credit-select"></select>

      <label>金額(円)</label>
      <input type="number" id="amount-input" placeholder="例: 50000">

      <div class="msg hidden" id="validation-msg"></div>

      <button id="submit-btn">解答する</button>
    </div>

    <div id="result-box" class="box hidden">
      <div class="result-title" id="result-title">正解</div>
      <div class="user-answer-box" id="user-answer-box"></div>
      <div class="answer-box" id="correct-answer-box"></div>
      <div class="explanation">
        <b>解説</b><br>
        <span id="explanation-text"></span>
      </div>
      <button id="copy-btn" class="copy-btn">AIに質問用にコピー</button>
      <div class="toast" id="copy-toast"></div>
      <button id="redo-btn" class="secondary">この問題をやり直す</button>
    </div>

    <a href="#" class="back-link" id="quiz-home-link">トップに戻る(この回のセッションは中断されます)</a>
  </div>

  <!-- ============ 結果画面 ============ -->
  <div id="summary-screen" class="hidden">
    <div class="box">
      <div style="text-align:center; font-size:13px; color:#A9822F;">RESULT</div>
      <div style="text-align:center; font-size:14px;" id="summary-cat-name">-</div>
      <div class="summary-score"><span id="final-score">0</span> / <span id="final-total">5</span></div>
      <div style="text-align:center; font-size:13px; color:#555555; margin-bottom:10px;" id="summary-msg">お疲れさまでした。</div>
      <div id="review-list"></div>
      <button id="retry-btn">もう一度この分野に挑戦</button>
      <button id="summary-home-btn" class="secondary">トップに戻る</button>
    </div>
  </div>

  <footer>簿記三級 仕訳ドリル・ローカル版</footer>
</div>

var SESSION_SIZE = 5;
var STATS_KEY = "boki3_stats_v1";

// =========================================================
// 状態管理
// =========================================================
var stats = loadStats();
var session = null; // { catId, questions: [...], submissions: [...], current: 0 }

function byId(id) { return document.getElementById(id); }

function loadStats() {
  try {
    var raw = localStorage.getItem(STATS_KEY);
    if (!raw) return {};
    return JSON.parse(raw);
  } catch (e) {
    return {};
  }
}

function saveStats() {
  try {
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
  } catch (e) {
    // localStorageが使えない環境では保存をあきらめる(致命的エラーにはしない)
  }
}

function getCatStats(catId) {
  if (!stats[catId]) {
    stats[catId] = { attempts: 0, correct: 0, wrongIds: [] };
  }
  return stats[catId];
}

function findCategory(catId) {
  for (var i = 0; i < CATEGORIES.length; i++) {
    if (CATEGORIES[i].id === catId) return CATEGORIES[i];
  }
  return null;
}

function findQuestion(catId, qId) {
  var cat = findCategory(catId);
  for (var i = 0; i < cat.questions.length; i++) {
    if (cat.questions[i].id === qId) return cat.questions[i];
  }
  return null;
}

// =========================================================
// ホーム画面
// =========================================================
function renderHome() {
  showScreen("home");

  // 苦手分野バナー(挑戦済みの中で正答率が最も低いもの)
  var weakest = null;
  var weakestRate = 101;
  for (var i = 0; i < CATEGORIES.length; i++) {
    var s = stats[CATEGORIES[i].id];
    if (s && s.attempts > 0) {
      var rate = (s.correct / s.attempts) * 100;
      if (rate < weakestRate) {
        weakestRate = rate;
        weakest = CATEGORIES[i];
      }
    }
  }
  if (weakest && weakestRate < 80) {
    byId('weak-banner').className = "weak-banner";
    byId('weak-cat-name').textContent = weakest.name + "(正答率 " + Math.round(weakestRate) + "%)";
    byId('weak-start-btn').onclick = function () { startSession(weakest.id); };
  } else {
    byId('weak-banner').className = "weak-banner hidden";
  }

  var html = "";
  for (var j = 0; j < CATEGORIES.length; j++) {
    var cat = CATEGORIES[j];
    var s = getCatStats(cat.id);
    var rateText = s.attempts > 0 ? Math.round((s.correct / s.attempts) * 100) + "%" : "未挑戦";
    var rateClass = (s.attempts > 0 && (s.correct / s.attempts) * 100 < 80) ? "cat-card-stat weak" : "cat-card-stat";
    var fillWidth = s.attempts > 0 ? Math.round((s.correct / s.attempts) * 100) : 0;

    html += '<div class="cat-card">' +
      '<div class="cat-card-top">' +
        '<span class="cat-card-name">' + cat.name + '</span>' +
        '<span class="' + rateClass + '">正答率 ' + rateText + '</span>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + fillWidth + '%;"></div></div>' +
      '<button data-catid="' + cat.id + '" class="start-cat-btn">挑戦する(全' + cat.questions.length + '問中5問)</button>' +
      '</div>';
  }
  byId('cat-list').innerHTML = html;

  var buttons = document.querySelectorAll('.start-cat-btn');
  for (var k = 0; k < buttons.length; k++) {
    buttons[k].addEventListener('click', function (ev) {
      startSession(ev.target.getAttribute('data-catid'));
    });
  }
}

byId('reset-link').addEventListener('click', function (ev) {
  ev.preventDefault();
  if (confirm("すべての成績をリセットします。よろしいですか?")) {
    stats = {};
    saveStats();
    renderHome();
  }
});

// =========================================================
// 出題セッション
// =========================================================
function pickSessionQuestions(cat) {
  var s = getCatStats(cat.id);
  var wrongSet = {};
  for (var i = 0; i < s.wrongIds.length; i++) wrongSet[s.wrongIds[i]] = true;

  var seenSet = {};
  // sessionを繰り返した履歴は保持しないため、ここでは「間違えたことがある」= 優先出題のみ扱う
  var weak = [];
  var others = [];
  for (var j = 0; j < cat.questions.length; j++) {
    var q = cat.questions[j];
    if (wrongSet[q.id]) weak.push(q); else others.push(q);
  }
  shuffle(weak);
  shuffle(others);
  var picked = weak.concat(others).slice(0, Math.min(SESSION_SIZE, cat.questions.length));
  shuffle(picked);
  return picked;
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function startSession(catId) {
  var cat = findCategory(catId);
  var qs = pickSessionQuestions(cat);
  session = {
    catId: catId,
    questions: qs,
    submissions: new Array(qs.length).fill(null),
    current: 0
  };
  showScreen("quiz");
  byId('quiz-cat-name').textContent = cat.name;
  byId('q-total').textContent = qs.length;
  fillSelect(byId('debit-select'), cat.accounts);
  fillSelect(byId('credit-select'), cat.accounts);
  loadQuestion();
}

function fillSelect(sel, accounts) {
  var html = '<option value="">選択してください</option>';
  for (var i = 0; i < accounts.length; i++) {
    html += '<option value="' + accounts[i] + '">' + accounts[i] + '</option>';
  }
  sel.innerHTML = html;
}

function currentSessionScore() {
  var n = 0;
  for (var i = 0; i < session.submissions.length; i++) {
    if (session.submissions[i] && session.submissions[i].correct) n++;
  }
  return n;
}

function updateNavButtons() {
  byId('prev-nav-btn').disabled = (session.current === 0);
  if (session.current === session.questions.length - 1) {
    byId('next-nav-btn').textContent = "結果を見る";
  } else {
    byId('next-nav-btn').textContent = "次の問題 →";
  }
  byId('next-nav-btn').disabled = false;
}

function showQuestionForm(prefill) {
  var q = session.questions[session.current];
  byId('q-num').textContent = session.current + 1;
  byId('cat-tag').textContent = q.cat;
  byId('question-text').textContent = q.text;
  byId('debit-select').value = prefill ? prefill.d : "";
  byId('credit-select').value = prefill ? prefill.c : "";
  byId('amount-input').value = prefill ? prefill.amt : "";
  byId('validation-msg').className = "msg hidden";
  byId('question-box').className = "box";
  byId('result-box').className = "box hidden";
  updateNavButtons();
}

function showResult() {
  var q = session.questions[session.current];
  var sub = session.submissions[session.current];
  byId('q-num').textContent = session.current + 1;

  if (sub.correct) {
    byId('result-title').textContent = "正解";
    byId('result-title').className = "result-title correct";
  } else {
    byId('result-title').textContent = "不正解";
    byId('result-title').className = "result-title wrong";
  }
  byId('user-answer-box').innerHTML = "あなたの回答: 借方「<b>" + sub.d + "</b>」 / 貸方「<b>" + sub.c + "</b>」 / " + Number(sub.amt).toLocaleString() + "円";
  byId('correct-answer-box').innerHTML = "正解: 借方「<b>" + q.debit + "</b>」 / 貸方「<b>" + q.credit + "</b>」 / " + q.amount.toLocaleString() + "円";
  byId('explanation-text').textContent = q.exp;
  byId('copy-toast').textContent = "";

  byId('question-box').className = "box hidden";
  byId('result-box').className = "box";
  updateNavButtons();
}

function loadQuestion() {
  if (session.submissions[session.current]) {
    showResult();
  } else {
    showQuestionForm(null);
  }
}

function submitAnswer() {
  var q = session.questions[session.current];
  var d = byId('debit-select').value;
  var c = byId('credit-select').value;
  var amountStr = byId('amount-input').value;
  var amt = Number(amountStr);

  if (!d || !c || !amountStr) {
    byId('validation-msg').textContent = "借方・貸方・金額をすべて入力してください。";
    byId('validation-msg').className = "msg";
    return;
  }

  var correct = (d === q.debit && c === q.credit && amt === q.amount);
  session.submissions[session.current] = { d: d, c: c, amt: amt, correct: correct };

  // 成績を反映(問題ごとに集計)
  var s = getCatStats(session.catId);
  s.attempts += 1;
  if (correct) {
    s.correct += 1;
    var idx = s.wrongIds.indexOf(q.id);
    if (idx !== -1) s.wrongIds.splice(idx, 1);
  } else {
    if (s.wrongIds.indexOf(q.id) === -1) s.wrongIds.push(q.id);
  }
  saveStats();

  showResult();
}

function redoQuestion() {
  var prefill = session.submissions[session.current];
  session.submissions[session.current] = null;
  showQuestionForm(prefill);
}

function goPrev() {
  if (session.current === 0) return;
  session.current--;
  loadQuestion();
}

function goNext() {
  if (session.current === session.questions.length - 1) {
    showSummary();
    return;
  }
  session.current++;
  loadQuestion();
}

function copyCurrentForAI() {
  var q = session.questions[session.current];
  var sub = session.submissions[session.current];
  var text = "【問題】" + q.text + "\n\n" +
    "【自分の回答】借方:" + sub.d + " / 貸方:" + sub.c + " / " + Number(sub.amt).toLocaleString() + "円(" + (sub.correct ? "正解" : "不正解") + ")\n\n" +
    "【模範解答】借方:" + q.debit + " / 貸方:" + q.credit + " / " + q.amount.toLocaleString() + "円\n\n" +
    "【解説】" + q.exp;
  copyText(text, byId('copy-toast'));
}

function copyText(text, toastEl) {
  function done(ok) {
    toastEl.textContent = ok ? "コピーしました。AIに貼り付けて質問できます。" : "コピーに失敗しました。手動で選択してコピーしてください。";
    setTimeout(function () { toastEl.textContent = ""; }, 3000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () { done(false); });
  } else {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done(true);
    } catch (e) {
      done(false);
    }
  }
}

  showScreen("summary");
  var cat = findCategory(session.catId);
  var score = currentSessionScore();

  byId('final-total').textContent = session.questions.length;
  byId('summary-msg').textContent = (score === session.questions.length) ? "全問正解です。お見事でした。" : "お疲れさまでした。";

  var wrongList = [];
  for (var i = 0; i < session.questions.length; i++) {
    var sub = session.submissions[i];
    if (!sub || !sub.correct) {
      wrongList.push({ q: session.questions[i], sub: sub, idx: i });
    }

  if (wrongList.length === 0) {
    byId('review-list').innerHTML = '<div class="review-item">今回は間違いなしです。</div>';
  } else {

      }
      html += '<div class="a">正解: 借方「' + q.debit + '」 / 貸方「' + q.credit + '」 / ' + q.amount.toLocaleString() + '円</div>' +
        '<div>' + q.exp + '</div>' +
        '<button class="copy-btn review-copy-btn" data-idx="' + j + '">AIに質問用にコピー</button>' +
        '<div class="toast" id="review-toast-' + j + '"></div>' +
        '</div>';
    }
    byId('review-list').innerHTML = html;

    var revButtons = document.querySelectorAll('.review-copy-btn');
    for (var k = 0; k < revButtons.length; k++) {
      revButtons[k].addEventListener('click', function (ev) {
        var idx = Number(ev.target.getAttribute('data-idx'));
        var item = wrongList[idx];
        var text = "【問題】" + item.q.text + "\n\n" +
          "【自分の回答】" + (item.sub ? ("借方:" + item.sub.d + " / 貸方:" + item.sub.c + " / " + Number(item.sub.amt).toLocaleString() + "円") : "(未回答)") + "\n\n" +
          "【模範解答】借方:" + item.q.debit + " / 貸方:" + item.q.credit + " / " + item.q.amount.toLocaleString() + "円\n\n" +
          "【解説】" + item.q.exp;
        copyText(text, byId('review-toast-' + idx));
      });
    }
  }
}

// =========================================================
// 画面切り替え
// =========================================================
function showScreen(name) {
  byId('home-screen').className = (name === "home") ? "" : "hidden";
  byId('quiz-screen').className = (name === "quiz") ? "" : "hidden";
  byId('summary-screen').className = (name === "summary") ? "" : "hidden";
}

// =========================================================
// イベント登録・初期化
// =========================================================
byId('submit-btn').addEventListener('click', submitAnswer);
byId('redo-btn').addEventListener('click', redoQuestion);
byId('prev-nav-btn').addEventListener('click', goPrev);
byId('next-nav-btn').addEventListener('click', goNext);
byId('copy-btn').addEventListener('click', copyCurrentForAI);
byId('retry-btn').addEventListener('click', function () { startSession(session.catId); });
byId('summary-home-btn').addEventListener('click', renderHome);
byId('quiz-home-link').addEventListener('click', function (ev) { ev.preventDefault(); renderHome(); });

renderHome();
</script>
